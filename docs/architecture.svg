<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 750" font-family="Helvetica,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c33"/></marker></defs>
<rect width="1020" height="750" fill="#fff"/>
<text x="510" y="28" text-anchor="middle" font-size="18" font-weight="bold">Book Writing Agent OS: Part 1 architecture (6 agents)</text>
<rect x="300" y="50" width="700" height="650" rx="12" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
<text x="316" y="70" font-weight="bold" fill="#555">Stage 2: per chapter (repeat)</text>
<text x="40" y="70" font-weight="bold" fill="#555" display="none">Stage 1</text>
<g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M150 99V125"/><path d="M150 185V215"/><path d="M150 271V300"/>
<path d="M250 325H275V113H330"/>
<path d="M470 141V170"/><path d="M610 190H635V212H610"/><path d="M470 232V255"/><path d="M470 305V335"/>
<path d="M470 405V430"/><path d="M470 490V520"/><path d="M470 580V610"/>
<path d="M610 370H680"/><path d="M610 550H680"/>
<path d="M50 243H30V155H50"/>
</g>
<g stroke-width="1.5" fill="none">
<path d="M815 335V280H610" stroke="#333" marker-end="url(#a)"/>
<path d="M610 460H815V405" stroke="#333" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M950 570H985V113H610" stroke="#777" stroke-dasharray="3 4" marker-end="url(#a)"/>
</g>
<rect x="50" y="55" width="200" height="44" rx="8" fill="#eef" stroke="#339"/><text x="150" y="82" text-anchor="middle">Author: book setup</text>
<rect x="50" y="125" width="200" height="60" rx="8" fill="#dff" stroke="#088"/><text x="150" y="150" text-anchor="middle" font-weight="bold">1. Planner</text><text x="150" y="168" text-anchor="middle">title, voice, names, chapters</text>
<rect x="50" y="215" width="200" height="56" rx="8" fill="#ffd" stroke="#a80"/><text x="150" y="240" text-anchor="middle" font-weight="bold">HUMAN GATE 1</text><text x="150" y="257" text-anchor="middle">approve / revise / quit</text>
<text x="38" y="205" text-anchor="end" font-size="11" fill="#555">revise</text>
<rect x="50" y="300" width="200" height="50" rx="8" fill="#eee" stroke="#555"/><text x="150" y="322" text-anchor="middle" font-weight="bold">Seed memory</text><text x="150" y="338" text-anchor="middle" font-size="12">bible + key names</text>
<rect x="330" y="85" width="280" height="56" rx="8" fill="#dff" stroke="#088"/><text x="470" y="108" text-anchor="middle" font-weight="bold">2. Outliner</text><text x="470" y="126" text-anchor="middle">chapter into 4-8 sections + word targets</text>
<rect x="330" y="170" width="280" height="62" rx="8" fill="#dff" stroke="#088"/><text x="470" y="194" text-anchor="middle" font-weight="bold">3. Writer</text><text x="470" y="212" text-anchor="middle">one section at a time (memory + text so far)</text>
<text x="642" y="205" font-size="11" fill="#555">short? expand</text>
<rect x="330" y="255" width="280" height="50" rx="8" fill="#eee" stroke="#555"/><text x="470" y="276" text-anchor="middle" font-weight="bold">Rule checks (no LLM)</text><text x="470" y="294" text-anchor="middle" font-size="12">auto-fix misspelled names</text>
<rect x="330" y="335" width="280" height="70" rx="8" fill="#dff" stroke="#088"/><text x="470" y="358" text-anchor="middle" font-weight="bold">4. Critic</text><text x="470" y="376" text-anchor="middle" font-size="12">rules: repetition, length</text><text x="470" y="392" text-anchor="middle" font-size="12">LLM: consistency, facts, style, coverage, flow</text>
<rect x="330" y="430" width="280" height="60" rx="8" fill="#ffd" stroke="#a80"/><text x="470" y="455" text-anchor="middle" font-weight="bold">HUMAN GATE 2</text><text x="470" y="473" text-anchor="middle">approve / revise / edit draft file / quit</text>
<rect x="330" y="520" width="280" height="60" rx="8" fill="#dff" stroke="#088"/><text x="470" y="545" text-anchor="middle" font-weight="bold">6. Archivist</text><text x="470" y="563" text-anchor="middle" font-size="12">summary, names, facts, stories, open threads</text>
<rect x="330" y="610" width="280" height="60" rx="8" fill="#eef" stroke="#339"/><text x="470" y="635" text-anchor="middle" font-weight="bold">Output files</text><text x="470" y="653" text-anchor="middle" font-size="12">chapter_NN.md, manuscript.md, usage.json</text>
<rect x="680" y="335" width="270" height="70" rx="8" fill="#dff" stroke="#088"/><text x="815" y="358" text-anchor="middle" font-weight="bold">5. Editor</text><text x="815" y="376" text-anchor="middle" font-size="12">smallest fix: exact find/replace edits</text><text x="815" y="392" text-anchor="middle" font-size="12">or rewrite of only affected sections</text>
<rect x="680" y="520" width="270" height="100" rx="8" fill="#eee" stroke="#555"/><text x="815" y="545" text-anchor="middle" font-weight="bold">Memory (files)</text><text x="815" y="565" text-anchor="middle" font-size="12">bible, names + aliases, terms, facts,</text><text x="815" y="581" text-anchor="middle" font-size="12">stories used, open threads, summaries,</text><text x="815" y="597" text-anchor="middle" font-size="12">chapter endings</text>
<text x="620" y="362" font-size="11" fill="#c33">issues</text><text x="640" y="296" font-size="11" fill="#c33">fixed text re-checked</text>
<text x="835" y="450" font-size="11" fill="#555">author feedback</text>
<text x="486" y="424" font-size="11" fill="#555">passed / rounds used</text>
<text x="486" y="510" font-size="11" fill="#555">approve</text>
<text x="632" y="543" font-size="11" fill="#555">writes</text>
<text x="880" y="108" font-size="11" fill="#555">read by every agent</text>
<text x="510" y="728" text-anchor="middle" font-size="12" fill="#555">Memory is updated only after the author approves a chapter, so rejected drafts never pollute it. Runs resume from the last saved section.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
